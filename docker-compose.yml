services:
  dataops-platform:
    build: .
    container_name: house_price_dataops_platform
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=House Price Prediction DataOps & API Platform
      - APP_ENV=production
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - SCHEDULER_INTERVAL_SECONDS=120
      - AUTO_START_SCHEDULER=true
      - SIMULATE_MISSING_PCT=0.02
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - CLOUDWATCH_ENABLED=${CLOUDWATCH_ENABLED:-false}
      - CLOUDWATCH_LOG_GROUP=/dataops/pipeline
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./models:/app/models
    restart: unless-stopped
